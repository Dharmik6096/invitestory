<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Wedding Invitation | Live Invitation</title>
    <meta name="description" content="You are cordially invited to our wedding celebration.">
    <meta property="og:title" content="Wedding Invitation">
    <meta property="og:description" content="Open to experience our interactive digital invitation.">
    <meta property="og:image" content="/card%201/uploads/og/royale-1793891310-vjgsvu.webp">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a000a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #cardFrame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            margin: 0;
            padding: 0;
        }

        .guest-banner {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #3b0024;
            padding: 9px 24px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
            z-index: 10000;
            display: none;
            letter-spacing: 0.5px;
            pointer-events: none;
            border: 1px solid rgba(240, 201, 120, 0.6);
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @media (max-width: 600px) {
            .guest-banner {
                top: 10px;
                font-size: 12px;
                padding: 7px 18px;
            }
        }

        .ist-viral-cta {
            position: fixed;
            bottom: 14px;
            right: 14px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(28, 12, 18, 0.86);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #f8e3b4;
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 9999px;
            padding: 7px 12px 7px 14px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .ist-viral-cta a {
            color: #f8e3b4;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ist-viral-cta a strong {
            color: #ffffff;
            font-weight: 700;
        }

        .ist-viral-cta:hover {
            transform: translateY(-1px);
            border-color: rgba(212, 175, 55, 0.85);
        }

        .ist-viral-close {
            background: transparent;
            border: 0;
            color: rgba(248, 227, 180, 0.7);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
        }

        .ist-viral-close:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .ist-viral-cta {
                bottom: 10px;
                right: 10px;
                font-size: 11px;
                padding: 6px 10px 6px 12px;
            }
        }
    </style>
</head>

<body>

    <div class="guest-banner" id="guestGreeting"></div>

    <div class="ist-viral-cta" id="istViralCta" style="display:none;">
        <a id="istViralLink" href="/?utm_source=invite_card&utm_medium=guest_badge" target="_blank" rel="noopener">
            <span>Crafted by <strong>InviteStory</strong> · Make Yours →</span>
        </a>
        <button type="button" class="ist-viral-close" id="istViralClose" aria-label="Dismiss">&times;</button>
    </div>

    <iframe id="cardFrame" allow="autoplay; fullscreen" title="Wedding Invitation" style="width:100%;height:100%;border:0;display:block;"></iframe>

    <script src="/shared/cloud-storage.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            var slug = params.get('card') || params.get('slug') || hashParams.get('card') || hashParams.get('slug') || '';
            var guest = params.get('guest') || hashParams.get('guest');
            var names = params.get('names') || params.get('couple') || hashParams.get('names');

            // Handle unencoded '&' in URL query string for couple names
            if (!names && window.location.search.indexOf('names=') !== -1) {
                var m = window.location.search.match(/[?&]names=([^&#]+)/i);
                if (m) {
                    try { names = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch(_) { names = m[1]; }
                }
            }

            // Immediately sanitize URL in address bar if legacy #d= or &d= was opened
            if ((window.location.hash && window.location.hash.indexOf('d=') !== -1) ||
                (window.location.search && window.location.search.indexOf('&d=') !== -1)) {
                try {
                    var cleanUrl = window.location.pathname + '?card=' + encodeURIComponent(slug) + (names ? '&names=' + encodeURIComponent(names) : '');
                    window.history.replaceState(null, '', cleanUrl);
                } catch (_) {}
            }

            // Check if guest name is in URL
            if (guest) {
                var pill = document.getElementById('guestGreeting');
                if (pill) {
                    pill.textContent = 'Special Invitation for ' + decodeURIComponent(guest);
                    pill.style.display = 'block';
                }
            }

            var frame = document.getElementById('cardFrame');

            var knownCardId = null;
            var latestCardData = null;
            try {
                var cached = localStorage.getItem('card_' + slug);
                if (cached) {
                    latestCardData = JSON.parse(cached);
                    if (latestCardData && latestCardData.cardId) knownCardId = latestCardData.cardId;
                }
            } catch (_) {}

            // Always query Cloud API synchronously if slug is present, to guarantee fresh data across all browsers
            if (slug) {
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', '/api/card/?slug=' + encodeURIComponent(slug) + '&v=' + Date.now(), false);
                    xhr.send(null);
                    if (xhr.status === 200 && xhr.responseText) {
                        var cloudJson = JSON.parse(xhr.responseText);
                        if (cloudJson && cloudJson.cardId) knownCardId = cloudJson.cardId;
                        if (cloudJson && cloudJson.data) {
                            latestCardData = cloudJson.data;
                            try { localStorage.setItem('card_' + slug, JSON.stringify(cloudJson.data)); } catch(_) {}
                        }
                    }
                } catch(_) {}
            }

            // Determine template endpoint
            function getTemplateBase(cardSlug, cardId) {
                var cid = parseInt(cardId, 10);
                var s = (cardSlug || '').toLowerCase();
                if (cid === 104 || s === '4' || s === '104' || s.indexOf('bloom') !== -1 || s.indexOf('ever-after') !== -1 || s.indexOf('eab') !== -1 || s.indexOf('storybook') !== -1) {
                    return { src: '/card%204/templates/ever-after-bloom/index.html', title: 'Ever After Bloom' };
                } else if (cid === 101 || s === '3' || s === '101' || s.indexOf('palna') !== -1 || s.indexOf('baby') !== -1 || s.indexOf('wax') !== -1) {
                    return { src: '/card%203/templates/shahi-palna/index.html', title: 'Wax Seal Royale Baby Shower' };
                } else if (cid === 103 || s === '2' || s === '103' || s.indexOf('lotus') !== -1 || s.indexOf('papercut') !== -1) {
                    return { src: '/card%202/templates/papercut-magenta/index.html', title: 'Papercut Lotus' };
                } else if (cid === 105 || s === '5' || s === '105' || s.indexOf('mithril') !== -1 || s.indexOf('aabha') !== -1) {
                    return { src: '/card%205/templates/mithril/index.html', title: 'Aabha (Mithril) Heirloom' };
                }
                return { src: '/card%201/templates/royale/index.html', title: 'Shahi Patra' };
            }

            var tpl = getTemplateBase(slug, knownCardId);
            if (names) {
                document.title = decodeURIComponent(names) + ' | ' + tpl.title;
            } else {
                document.title = tpl.title + ' | Wedding Invitation';
            }

            // Immediate zero-latency frame mounting for instant mobile render
            var initialSearch = slug ? ('?card=' + encodeURIComponent(slug)) : '';
            if (names) initialSearch += (initialSearch ? '&' : '?') + 'names=' + encodeURIComponent(names);
            if (params.has('edit') || params.get('edit') === '1') initialSearch += (initialSearch ? '&' : '?') + 'edit=1';
            if (params.has('admin') || params.get('admin') === '1') initialSearch += (initialSearch ? '&' : '?') + 'admin=1';
            initialSearch += (initialSearch ? '&' : '?') + '_v=' + Date.now();
            frame.src = tpl.src + initialSearch;

            // Show subtle viral CTA badge for wedding guests (hidden in edit/admin mode)
            var isEditor = params.has('edit') || params.get('edit') === '1' || params.has('admin') || params.get('admin') === '1';
            var viralCta = document.getElementById('istViralCta');
            var viralLink = document.getElementById('istViralLink');
            var viralClose = document.getElementById('istViralClose');
            if (viralCta && !isEditor) {
                if (viralLink && slug) {
                    viralLink.href = '/?utm_source=invite_card&utm_medium=guest_badge&utm_campaign=' + encodeURIComponent(slug);
                }
                setTimeout(function () { viralCta.style.display = 'inline-flex'; }, 2500);
                if (viralClose) {
                    viralClose.addEventListener('click', function () { viralCta.style.display = 'none'; });
                }
            }

            // Background cloud sync with postMessage bridge to iframe
            function syncDataToFrame(data) {
                if (!data || !frame.contentWindow) return;
                try {
                    frame.contentWindow.postMessage({
                        type: 'INVITESTORY_UPDATE_CARD',
                        slug: slug,
                        data: data
                    }, '*');
                } catch (_) {}
            }

            frame.addEventListener('load', function () {
                if (latestCardData) syncDataToFrame(latestCardData);
            });

            // Listen for balcony:save from within frame
            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'balcony:save' && e.data.config) {
                    if (slug) {
                        try { localStorage.setItem('card_' + slug, JSON.stringify(e.data.config)); } catch (_) {}
                        if (window.CloudStorage && typeof window.CloudStorage.saveCard === 'function') {
                            window.CloudStorage.saveCard(slug, e.data.config, { cardId: knownCardId });
                        }
                    }
                }
            });

            if (slug && window.CloudStorage) {
                window.CloudStorage.getCard(slug).then(function (data) {
                    if (data && typeof data === 'object') {
                        latestCardData = data;
                        syncDataToFrame(data);
                    }
                }).catch(function () {});
            }
        })();
    </script>
    <script src="/security/anti-theft.js"></script>
</body>

</html>
