# ==============================================================================
# Nginx Reverse Proxy Configuration for Invitation Card Website
# Upstream Target: https://invitation-card-umber-six.vercel.app
# ==============================================================================

# HTTP Server Block - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name invitation.com www.invitation.com; 

    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block - Reverse Proxy to Vercel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com; # Replace with your custom domain or IP

    # SSL Certificate Paths (Adjust if using Let's Encrypt or custom SSL)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum payload size (allows high-res wedding photo uploads)
    client_max_body_size 50M;

    # Gzip Compression for fast mobile loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Reverse proxy upstream: Vercel Production
    location / {
        # Target Vercel application
        proxy_pass https://invitation-card-umber-six.vercel.app;

        # CRITICAL FOR VERCEL: Enable SNI and set upstream Host
        # Without these, Vercel edge/Cloudflare rejects proxy requests with 403 Forbidden or SSL error
        proxy_ssl_server_name on;
        proxy_ssl_name invitation-card-umber-six.vercel.app;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host invitation-card-umber-six.vercel.app;

        # Client IP and Protocol headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket and Server-Sent Events support (for live preview & updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for large uploads or slow mobile connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Custom caching rules for static media assets
    location ~* \.(mp3|mp4|webp|svg|woff2|woff|otf|png|jpg|jpeg)$ {
        proxy_pass https://invitation-card-umber-six.vercel.app;
        proxy_ssl_server_name on;
        proxy_ssl_name invitation-card-umber-six.vercel.app;
        proxy_set_header Host invitation-card-umber-six.vercel.app;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Prevent caching on dynamic APIs and card data
    location ~* ^/(api|cards)/ {
        proxy_pass https://invitation-card-umber-six.vercel.app;
        proxy_ssl_server_name on;
        proxy_ssl_name invitation-card-umber-six.vercel.app;
        proxy_set_header Host invitation-card-umber-six.vercel.app;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
